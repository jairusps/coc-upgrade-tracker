
name: Clash of Clans Personal Tracker

on:
  schedule:
    # GitHub Actions cron uses UTC.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Clash of Clans tracker
        env:
          PLAYER_TAG: ${{ secrets.PLAYER_TAG }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python tracker.py

      - name: Save tracker state
        # Also run after a tracker/email failure. The tracker saves state
        # immediately after a successful API fetch, before sending email.
        # This prevents a successful API fetch followed by an SMTP failure
        # from causing the same upgrade to be emailed again next run.
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "state.json was not created. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update tracker state [skip ci]"
          git push
